name: LaunchFlow PR validation

on:
  pull_request:
    branches: [develop, chatgpt, smartest-app-developer]
  push:
    branches: [smartest-app-developer]

permissions:
  contents: read

concurrency:
  group: launchflow-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Validate source and packaging
        run: python tools/Verify-LaunchFlow-Source.py
      - name: Restore dependencies
        run: dotnet restore LaunchFlow/LaunchFlow.csproj
      - name: Run safety regression smoke tests
        run: dotnet run --project tests/LaunchFlow.SafetySmokeTests/LaunchFlow.SafetySmokeTests.csproj --configuration Release
      - name: Compile Windows desktop app
        run: dotnet build LaunchFlow/LaunchFlow.csproj --configuration Release --no-restore -warnaserror
