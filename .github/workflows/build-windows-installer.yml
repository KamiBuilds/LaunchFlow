# Produces the ONLY file end users need: LaunchFlow-Setup-v0.7.8-x64.exe
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "LaunchFlow/**"
      - "installer/**"
      - "tools/**"
      - "BUILD-INSTALLER.ps1"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup." }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish self-contained LaunchFlow
        shell: pwsh
        run: |
          $publishDir = Join-Path $PWD "publish"
          if (Test-Path $publishDir) { Remove-Item $publishDir -Recurse -Force }
          dotnet publish (Join-Path $PWD "LaunchFlow\LaunchFlow.csproj") `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishDir
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          & $env:ISCC (Join-Path $PWD "installer\LaunchFlow.iss")
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $exe = Join-Path $PWD "dist\LaunchFlow-Setup-v0.7.8-x64.exe"
          if (-not (Test-Path $exe)) { throw "Installer missing: $exe" }

      - name: Upload DOWNLOAD THIS installer
        uses: actions/upload-artifact@v4
        with:
          name: DOWNLOAD-LaunchFlow-Setup-v0.7.8-x64
          path: dist/LaunchFlow-Setup-v0.7.8-x64.exe
          if-no-files-found: error
          retention-days: 90
