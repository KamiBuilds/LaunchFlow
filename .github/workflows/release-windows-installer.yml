name: Release Windows installers
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile LaunchFlow setup
        shell: pwsh
        run: |
          ./BUILD-INSTALLER.ps1 -Yes -NoAutoInstall
          if ($LASTEXITCODE -ne 0) { throw 'LaunchFlow setup compilation failed' }
      - name: Compile universal installer
        shell: pwsh
        run: |
          Set-Content .\bootstrapper\release-source.txt 'KamiBuilds/LaunchFlow' -Encoding utf8
          dotnet publish .\bootstrapper\LaunchFlow.UniversalInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o .\dist\universal
          if ($LASTEXITCODE -ne 0) { throw 'Universal installer compilation failed' }
          Copy-Item .\dist\universal\LaunchFlow.UniversalInstaller.exe .\dist\LaunchFlow-Universal-Installer.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LaunchFlow-Windows-installers
          path: |
            dist/LaunchFlow-Setup-*.exe
            dist/LaunchFlow-Universal-Installer.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/LaunchFlow-Setup-*.exe
            dist/LaunchFlow-Universal-Installer.exe
          fail_on_unmatched_files: true
