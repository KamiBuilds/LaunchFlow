name: Owner-test LaunchFlow Windows installer

on:
  push:
    branches: [fix/v0.8.7-vault-native-stabilization-20261125, fix/v0.8.10-release-gates-and-save-status-20261127, fix/v0.8.11-hide-redundant-settings-bar-20261127]
    paths:
      - '.github/workflows/owner-test-installer.yml'
      - 'LaunchFlow/**'
      - 'tests/setup-validation/**'
      - 'tests/ui/**'
      - 'installer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-test-installer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout the exact test commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact commit
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne "$env:GITHUB_SHA") { throw "Source SHA mismatch" }
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Verify UI source and password-status visibility
        shell: pwsh
        run: |
          python tests/ui/verify_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'UI source-contract tests failed' }
      - name: Verify password-popup behavior using production handlers
        shell: pwsh
        run: |
          dotnet run --project ./tests/setup-validation/SetupValidationTests.csproj -c Release -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Password-popup behavior tests failed' }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
      - name: Build exact self-contained setup EXE
        shell: powershell
        run: |
          ./BUILD-INSTALLER.ps1 -NoAutoInstall
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          [xml]$project = Get-Content ./LaunchFlow/LaunchFlow.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $setup = "dist/LaunchFlow-Setup-v$version-x64.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'Setup executable missing' }
          "LF_VERSION=$version" >> $env:GITHUB_ENV
      - name: Record tested source and checksum
        shell: pwsh
        run: |
          $path="dist/LaunchFlow-Setup-v$env:LF_VERSION-x64.exe"
          $sum=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sum  LaunchFlow-Setup-v$env:LF_VERSION-x64.exe" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii
          "Source commit: $env:GITHUB_SHA" | Set-Content -LiteralPath 'dist/BUILD-SOURCE.txt'
          "Status: owner-test installer, not a release; full CI and independent Windows acceptance required." | Add-Content -LiteralPath 'dist/BUILD-SOURCE.txt'
      - name: Upload installer ZIP for owner testing
        uses: actions/upload-artifact@v6
        with:
          name: LaunchFlow-v${{ env.LF_VERSION }}-OWNER-TEST-${{ github.sha }}
          path: |
            dist/LaunchFlow-Setup-v${{ env.LF_VERSION }}-x64.exe
            dist/SHA256SUMS.txt
            dist/BUILD-SOURCE.txt
          if-no-files-found: error
          retention-days: 14
