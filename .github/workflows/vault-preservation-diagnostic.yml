name: Pending-unlock preservation diagnosis
on:
  push:
    branches: [fix/v0.8.8-reviewed-stabilization-20261125]
    paths: [.github/workflows/vault-preservation-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: preservation-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/fix/v0.8.8-reviewed-stabilization-20261125'
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: '15126235753'
          run-id: '45833874179'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/preservation-package
      - name: Prepare observation-only driver and fixed-boolean controls
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $appSha='5e8fb5fa1704e4e74c25798cf078c3c03a622679'
          $changed=@(& git diff --name-only $appSha HEAD)
          if($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/vault-preservation-diagnostic.yml'){throw 'UnexpectedDiagnosticSourceDelta'}
          $driver=Join-Path $env:RUNNER_TEMP 'preservation-driver'
          [void][IO.Directory]::CreateDirectory($driver)
          Copy-Item -Path './tests/native-vault/*' -Destination $driver -Recurse -Force
          . (Join-Path $driver 'Contracts.ps1')
          . (Join-Path $driver 'Ownership.ps1')
          . (Join-Path $driver 'Scenarios.ps1')
          $package=Read-Package (Join-Path $env:RUNNER_TEMP 'preservation-package') $appSha
          if($package.binding.installerSha256 -cne '183591ccd0ac581de0a38c8fdc4155d615b08dda8f37ca11dc9092019d8c1296'){throw 'BindingMismatch'}
          $observer=@'
          function Get-PreservationDelta($Before,$After) {
              $left=[Collections.Generic.Dictionary[string,object]]::new([StringComparer]::Ordinal)
              $right=[Collections.Generic.Dictionary[string,object]]::new([StringComparer]::Ordinal)
              foreach($entry in $Before.entries){$left.Add($entry.path,$entry)}
              foreach($entry in $After.entries){$right.Add($entry.path,$entry)}
              $result=[ordered]@{schema=1;RootChanged=($Before.exists -ne $After.exists)}
              $known=[ordered]@{Main='launchflow.db';Wal='launchflow.db-wal';Shm='launchflow.db-shm';Journal='launchflow.db-journal'}
              foreach($label in $known.Keys){
                  $name=$known[$label];$old=$null;$new=$null
                  if($left.ContainsKey($name)){$old=$left[$name]}
                  if($right.ContainsKey($name)){$new=$right[$name]}
                  $result[$label+'Added']=($null -eq $old -and $null -ne $new)
                  $result[$label+'Removed']=($null -ne $old -and $null -eq $new)
                  $result[$label+'Changed']=($null -ne $old -and $null -ne $new -and ($old.kind -cne $new.kind -or $old.bytes -ne $new.bytes -or $old.sha256 -cne $new.sha256))
              }
              $other=$false;$names=[Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
              foreach($name in @($left.Keys)+@($right.Keys)){[void]$names.Add($name)}
              foreach($name in $names){
                  if($name -cin @($known.Values)+@('startup-diagnostics.log','startup-diagnostics.log.previous')){continue}
                  if(-not $left.ContainsKey($name) -or -not $right.ContainsKey($name)){$other=$true;continue}
                  $a=$left[$name];$b=$right[$name]
                  if($a.kind -cne $b.kind -or $a.bytes -ne $b.bytes -or $a.sha256 -cne $b.sha256){$other=$true}
              }
              $result.OtherChanged=$other
              return $result
          }
          $script:OriginalPreservationAssertion=${function:Assert-RecoveryRoot}
          function Assert-RecoveryRoot([string]$Root,$Before) {
              try { & $script:OriginalPreservationAssertion $Root $Before }
              catch {
                  $originalFailure=$_
                  if((Safe-Reason $originalFailure) -ceq 'RecoveryChanged'){
                      try {
                          $delta=Get-PreservationDelta $Before (Snapshot-RecoveryRoot $Root)
                          Write-Json (Join-Path $ResultRoot 'public/root-delta.json') $delta
                      }catch{}
                  }
                  throw $originalFailure
              }
          }
          '@
          Invoke-Expression $observer
          function Entry([string]$Name,[string]$Digest='a'){return [pscustomobject]@{path=$Name;kind='File';bytes=1;sha256=$Digest}}
          function Snap($Entries,[bool]$Exists=$true){return [pscustomobject]@{exists=$Exists;entries=@($Entries)}}
          $before=Snap @((Entry 'launchflow.db'))
          $same=Get-PreservationDelta $before (Snap @((Entry 'launchflow.db'),(Entry 'startup-diagnostics.log' 'b')))
          if(@($same.Values|Where-Object {$_ -is [bool] -and $_}).Count -ne 0){throw 'HealthyObservationIncorrect'}
          $main=Get-PreservationDelta $before (Snap @((Entry 'launchflow.db' 'b')))
          if(-not $main.MainChanged -or $main.WalAdded -or $main.OtherChanged){throw 'MainObservationIncorrect'}
          $sidecars=Get-PreservationDelta $before (Snap @((Entry 'launchflow.db'),(Entry 'launchflow.db-wal'),(Entry 'launchflow.db-shm')))
          if(-not $sidecars.WalAdded -or -not $sidecars.ShmAdded -or $sidecars.MainChanged -or $sidecars.OtherChanged){throw 'SidecarObservationIncorrect'}
          $other=Get-PreservationDelta (Snap @((Entry 'retained'))) (Snap @())
          if(-not $other.OtherChanged){throw 'OtherObservationIncorrect'}
          $gone=Get-PreservationDelta $before (Snap @() $false)
          if(-not $gone.RootChanged -or -not $gone.MainRemoved){throw 'RootObservationIncorrect'}
          $scenario=Join-Path $driver 'Scenarios.ps1'
          [IO.File]::WriteAllText($scenario,([IO.File]::ReadAllText($scenario)+"`r`n"+$observer),[Text.UTF8Encoding]::new($false))
          Write-Host 'PASS five fixed-boolean observation controls; original assertion retained'
      - name: Replay original installed case with unchanged application package
        id: observe
        continue-on-error: true
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP/preservation-driver/Test-NativeVault.ps1" -Case owned_wrong -PackageRoot "$env:RUNNER_TEMP/preservation-package" -SourceSha '5e8fb5fa1704e4e74c25798cf078c3c03a622679' -ResultRoot "$env:RUNNER_TEMP/preservation-case"
          exit $LASTEXITCODE
      - name: Validate observation separately from product acceptance
        id: sanitize
        if: always() && steps.observe.outcome != 'skipped'
        shell: powershell
        env:
          DRIVER_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          . "$env:RUNNER_TEMP/preservation-driver/Contracts.ps1"
          if($env:DRIVER_SHA -cnotmatch '^[0-9a-f]{40}$'){throw 'BindingMismatch'}
          $root=Join-Path $env:RUNNER_TEMP 'preservation-case/public'
          $report=Read-BoundedJson (Join-Path $root 'result.json')
          Assert-Keys $report @('schema','case','phase','category','reason','completed','remaining','binding','milestones','accepted')
          if($report.accepted -isnot [bool]){throw 'ManifestRejected'}
          $raw=[ordered]@{}
          foreach($key in @('schema','case','phase','category','reason','completed','remaining','binding','milestones')){$raw[$key]=$report.$key}
          $projected=Project-Report $raw
          if($projected.accepted -ne $report.accepted -or $report.case -cne 'owned_wrong' -or $report.binding.sourceSha -cne '5e8fb5fa1704e4e74c25798cf078c3c03a622679'){throw 'BindingMismatch'}
          $delta=$null
          if(-not $report.accepted){
              if($report.phase -cne 'UnlockPendingExit' -or $report.category -cne 'Application' -or $report.reason -cne 'RecoveryChanged' -or $report.remaining -ne 0){throw 'UnlocalizedDiagnosticOutcome'}
              $delta=Read-BoundedJson (Join-Path $root 'root-delta.json')
              $keys=@('schema','RootChanged','OtherChanged')
              foreach($label in @('Main','Wal','Shm','Journal')){foreach($suffix in @('Added','Removed','Changed')){$keys+=@($label+$suffix)}}
              Assert-Keys $delta $keys
              if(-not (Test-Integer $delta.schema) -or $delta.schema -ne 1){throw 'ManifestRejected'}
              foreach($key in $keys){if($key -cne 'schema' -and $delta.$key -isnot [bool]){throw 'ManifestRejected'}}
          }
          $public=Join-Path $env:RUNNER_TEMP 'preservation-observation'
          [void][IO.Directory]::CreateDirectory($public)
          $safe=[ordered]@{schema=1;applicationSourceSha='5e8fb5fa1704e4e74c25798cf078c3c03a622679';driverSourceSha=$env:DRIVER_SHA;reproduced=(-not $report.accepted);productAccepted=$report.accepted;report=$projected;delta=$delta}
          Write-Json (Join-Path $public 'observation.json') $safe
          Write-Host ('PASS bounded diagnostic collection; productAccepted='+$report.accepted)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && steps.sanitize.outcome == 'success'
        with:
          name: pending-unlock-observation
          path: ${{ runner.temp }}/preservation-observation/observation.json
          if-no-files-found: error
          retention-days: 3
